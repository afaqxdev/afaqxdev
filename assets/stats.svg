<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t"><title id="t">20+ production apps shipped, 4+ years of Flutter, 30+ developers mentored, 5.0 star rating on Fiverr</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.up{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fill{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:fill 1.4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes fill{to{transform:scaleX(1)}}
