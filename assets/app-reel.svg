.spark{transform-box:fill-box;transform-origin:center;animation:sp 2.2s ease-in-out infinite}@keyframes sp{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
.shine{animation:shine 3s ease-in-out infinite}@keyframes shine{0%,40%{transform:translateX(-160px)}80%,100%{transform:translateX(160px)}}
@media (prefers-reduced-motion: reduce){.p0{transform:translate(1130px,290px) scale(0.55);opacity:0}.p1{transform:translate(880px,290px) scale(0.78);opacity:0.6}.p2{transform:translate(600px,290px) scale(1);opacity:1}.p3{transform:translate(320px,290px) scale(0.78);opacity:0.6}.p4{transform:translate(70px,290px) scale(0.55);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-hide{display:none}}</style>
