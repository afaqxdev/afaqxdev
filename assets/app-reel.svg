<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t"><title id="t">A rotating carousel of phones showing apps by Afaq Zahir: TourVista, LQDCNVS, Nest AI, Fluently AI and GAIA AI</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@keyframes reel{0%,16%{transform:translate(1130px,290px) scale(0.55);opacity:0}20%,36%{transform:translate(880px,290px) scale(0.78);opacity:0.6}40%,56%{transform:translate(600px,290px) scale(1);opacity:1}60%,76%{transform:translate(320px,290px) scale(0.78);opacity:0.6}80%,100%{transform:translate(70px,290px) scale(0.55);opacity:0}}.reel{animation:reel 15s cubic-bezier(.65,0,.35,1) infinite}
