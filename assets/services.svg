<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t"><title id="t">What I do: Build something new — A 30-day MVP that works on launch day — iOS and Android from one Flutter codebase. Fix what's broken — Memory leaks, UI jank, architecture rot. I rescue codebases other teams gave up on. Add AI to your product — ChatGPT, Gemini and Claude with streaming — API keys never touch the client. Turn design into product — Pixel-accurate Figma → Flutter, with motion that holds 120fps on mid-range phones. Build the backend — Firebase and Cloud Functions that don't become a cost nightmare at scale. Take over a project — Code audit, migration and a clear plan — then I own it like I'll maintain it myself.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.bob{animation:bob 1.6s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-5px)}}
.flick{transform-box:fill-box;transform-origin:top;animation:fk .15s steps(2) infinite}@keyframes fk{50%{transform:scaleY(.55)}}
.swing{transform-box:fill-box;transform-origin:50% 100%;animation:sw 1.8s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.beat{transform-box:fill-box;transform-origin:center;animation:bt 1.4s ease-in-out infinite}@keyframes bt{50%{transform:scale(.7) rotate(45deg)}}
.draw{stroke-dasharray:70;animation:dr 2.4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:70}60%,100%{stroke-dashoffset:0}}
.led{animation:led 1.2s steps(1) infinite}@keyframes led{50%{opacity:.15}}
.check{stroke-dasharray:24;animation:ck 2.4s ease-out infinite}@keyframes ck{0%,20%{stroke-dashoffset:24}50%,100%{stroke-dashoffset:0}}
@keyframes hl0{0%,0.0%,16.7%,100%{stroke:#1F3D2C}2.0%,14.7%{stroke:#C8F135}}.hl0{animation:hl0 9s infinite}
