@keyframes hl4{0%,66.7%,83.3%,100%{stroke:#1F3D2C}68.7%,81.3%{stroke:#C8F135}}.hl4{animation:hl4 9s infinite}
@keyframes hl5{0%,83.3%,100.0%,100%{stroke:#1F3D2C}85.3%,98.0%{stroke:#C8F135}}.hl5{animation:hl5 9s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-hide{display:none}}</style>
