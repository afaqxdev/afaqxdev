<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="t"><title id="t">Stack — Mobile: Flutter, Dart, Riverpod, BLoC. AI: OpenAI, Gemini, Claude, Whisper, ML Kit. Backend: Firebase, Cloud Functions, Supabase, WebSockets. Payments and data: RevenueCat, Stripe, Hive, SQLite, SQLCipher, AES-256.</title>
