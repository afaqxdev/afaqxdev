<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="t"><title id="t">03 SHIPPED TO THE STORES</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.sweep{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:sw 1.2s .2s cubic-bezier(.7,0,.2,1) forwards}@keyframes sw{to{transform:scaleX(1)}}
.dot{animation:run 3.5s 1.4s ease-in-out infinite}@keyframes run{from{transform:translateX(0)}to{transform:translateX(720px)}}
@media (prefers-reduced-motion: reduce){.sweep{transform:none}.dot{display:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-hide{display:none}}</style>
