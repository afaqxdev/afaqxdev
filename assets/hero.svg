<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t"><title id="t">Afaq Zahir — Flutter, AI and mobile product engineer. Available for remote work.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.name{clip-path:inset(0 100% 0 0);animation:wipe 1.1s .2s cubic-bezier(.7,0,.2,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.fade{opacity:0;animation:fade .8s forwards}@keyframes fade{to{opacity:1}}
.pulse{transform-origin:72px 86px;animation:pulse 1.8s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.glow{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-260px,60px)}}
.phone{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.6s .4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.scroll{animation:scroll 3s linear infinite}@keyframes scroll{to{transform:translateX(-240px)}}
.bar{transform-box:fill-box;transform-origin:left;animation:bar 2.4s ease-in-out infinite alternate}@keyframes bar{from{transform:scaleX(.35)}to{transform:scaleX(1)}}
.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@keyframes r0{0%,0.00%{opacity:0;transform:translateY(14px)}3.00%,17.00%{opacity:1;transform:none}20.00%,100%{opacity:0;transform:translateY(-14px)}}.r0{opacity:0;animation:r0 15s infinite}@keyframes r1{0%,20.00%{opacity:0;transform:translateY(14px)}23.00%,37.00%{opacity:1;transform:none}40.00%,100%{opacity:0;transform:translateY(-14px)}}.r1{opacity:0;animation:r1 15s infinite}@keyframes r2{0%,40.00%{opacity:0;transform:translateY(14px)}43.00%,57.00%{opacity:1;transform:none}60.00%,100%{opacity:0;transform:translateY(-14px)}}.r2{opacity:0;animation:r2 15s infinite}@keyframes r3{0%,60.00%{opacity:0;transform:translateY(14px)}63.00%,77.00%{opacity:1;transform:none}80.00%,100%{opacity:0;transform:translateY(-14px)}}.r3{opacity:0;animation:r3 15s infinite}@keyframes r4{0%,80.00%{opacity:0;transform:translateY(14px)}83.00%,97.00%{opacity:1;transform:none}100.00%,100%{opacity:0;transform:translateY(-14px)}}.r4{opacity:0;animation:r4 15s infinite}
@media (prefers-reduced-motion: reduce){.name{clip-path:none}.fade{opacity:1}.phone{stroke-dashoffset:0}.r0{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.rm-hide{display:none}}</style>
<rect width="1200" height="440" rx="24" fill="#0C100D"/><rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#1F3D2C"/>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1F3D2C" stroke-width="1" opacity=".45"/></pattern>
  <radialGradient id="g"><stop offset="0" stop-color="#C8F135" stop-opacity=".28"/><stop offset="1" stop-color="#C8F135" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeGrid" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".55" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
  <mask id="gm"><rect width="1200" height="440" fill="url(#fadeGrid)"/></mask>
  <clipPath id="cardclip"><rect width="1200" height="440" rx="24"/></clipPath>
  <clipPath id="screen"><rect x="915" y="96" width="186" height="80" rx="10"/></clipPath>
</defs>
<g clip-path="url(#cardclip)">
  <rect width="1200" height="440" fill="url(#grid)" mask="url(#gm)"/>
  <circle class="glow" cx="1000" cy="120" r="320" fill="url(#g)"/>
</g>

<circle class="pulse" cx="72" cy="86" r="6" fill="#C8F135"/><circle cx="72" cy="86" r="6" fill="#C8F135"/>
<text class="mono fade" x="90" y="91" font-size="14" letter-spacing="2" fill="#C8F135" style="animation-delay:.1s">AVAILABLE FOR REMOTE WORK · US / UK / EU</text>

<text class="name" x="62" y="196" font-size="96" font-weight="800" letter-spacing="-3" fill="#ECF2E8">Afaq Zahir</text>
<text class="fade" x="66" y="244" font-size="26" fill="#93A398" style="animation-delay:.9s">Flutter · AI · Mobile product engineer</text>

<g class="mono" font-size="28">
  <text class="r0" x="66" y="314" fill="#C8F135" style="animation-delay:1.2s"><tspan fill="#ECF2E8">I </tspan>build production Flutter apps<tspan class="caret">_</tspan></text>
  <text class="r1" x="66" y="314" fill="#C8F135" style="animation-delay:1.2s"><tspan fill="#ECF2E8">I </tspan>ship AI features that stream<tspan class="caret">_</tspan></text>
  <text class="r2" x="66" y="314" fill="#C8F135" style="animation-delay:1.2s"><tspan fill="#ECF2E8">I </tspan>rescue failing codebases<tspan class="caret">_</tspan></text>
  <text class="r3" x="66" y="314" fill="#C8F135" style="animation-delay:1.2s"><tspan fill="#ECF2E8">I </tspan>profile every frame to 120fps<tspan class="caret">_</tspan></text>
  <text class="r4" x="66" y="314" fill="#C8F135" style="animation-delay:1.2s"><tspan fill="#ECF2E8">I </tspan>launch MVPs in 30 days<tspan class="caret">_</tspan></text>
</g>

<text class="mono fade" x="66" y="384" font-size="14" letter-spacing="1.5" fill="#93A398" style="animation-delay:1.4s">PROOF, NOT PROMISES  ·  PESHAWAR, PK (UTC+5)  ·  AFAQZAHIR.COM</text>

<!-- phone -->
<rect class="phone" x="900" y="48" width="216" height="352" rx="34" fill="#0C100D" stroke="#C8F135" stroke-width="2"/>
<rect x="976" y="62" width="64" height="16" rx="8" fill="#1F3D2C"/>
<g class="fade" style="animation-delay:1.3s">
  <rect x="915" y="96" width="186" height="80" rx="10" fill="#111812" stroke="#1F3D2C"/>
  <g clip-path="url(#screen)"><g transform="translate(915 118)"><g class="scroll">
    <polyline points="0,14 6,20 12,22 18,24 24,19 30,17 36,23 42,18 48,20 54,22 60,20 66,19 72,21 78,23 84,18 90,16 96,22 102,24 108,19 114,21 120,19 126,18 132,20 138,22 144,24 150,15 156,21 162,23 168,18 174,20 180,18 186,24 192,19 198,21 204,23 210,14 216,20 222,22 228,24 234,19 240,17" fill="none" stroke="#C8F135" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="0,14 6,20 12,22 18,24 24,19 30,17 36,23 42,18 48,20 54,22 60,20 66,19 72,21 78,23 84,18 90,16 96,22 102,24 108,19 114,21 120,19 126,18 132,20 138,22 144,24 150,15 156,21 162,23 168,18 174,20 180,18 186,24 192,19 198,21 204,23 210,14 216,20 222,22 228,24 234,19 240,17" transform="translate(240 0)" fill="none" stroke="#C8F135" stroke-width="2" stroke-linejoin="round"/>
  </g></g></g>
  <text class="mono" x="925" y="168" font-size="11" fill="#93A398">frame budget 8.3ms</text>
  <text x="915" y="232" font-size="54" font-weight="800" letter-spacing="-2" fill="#ECF2E8">120</text>
  <text class="mono" x="1030" y="232" font-size="15" fill="#C8F135">FPS</text>
  <text class="mono" x="917" y="254" font-size="11" fill="#93A398">profiled, not guessed</text>
  <rect class="bar" x="917" y="278" width="180" height="12" rx="6" fill="#C8F135" style="animation-delay:0s"/>
  <rect class="bar" x="917" y="304" width="140" height="12" rx="6" fill="#1F3D2C" style="animation-delay:0.4s"/>
  <rect class="bar" x="917" y="330" width="160" height="12" rx="6" fill="#1F3D2C" style="animation-delay:0.8s"/>
  <rect x="968" y="378" width="80" height="5" rx="2.5" fill="#34403A"/>
</g>
</svg>
