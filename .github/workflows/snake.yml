name: Contribution snake

on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#C8F135&color_dots=#161b22,#1F3D2C,#4A6B1F,#8DB02A,#C8F135
            dist/snake-light.svg?color_snake=#0C100D&color_dots=#ebedf0,#E3F5B0,#C8F135,#8DB02A,#4A6B1F

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
